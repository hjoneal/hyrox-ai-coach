[project]
name = "hyrox-performance-analytics"
version = "0.1.0"
description = "Data-driven performance analysis of Hyrox race results: in-race finish time prediction, venue difficulty modeling, and pacing archetype clustering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]
